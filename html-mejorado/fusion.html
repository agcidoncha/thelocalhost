      const frame = document.getElementById("experienceFrame");
      let currentMode = "";

      const decodeHtml = encoded => {
        const binary = atob(encoded);
        const bytes = new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i+=1) bytes[i]=binary.charCodeAt(i);
        return new TextDecoder("utf-8").decode(bytes);
      };

      const getMode = () => window.innerWidth <= BREAKPOINT ? "mobile" : "desktop";

      const renderExperience = () => {
        const nextMode = getMode();
        if(nextMode === currentMode) return;
        currentMode = nextMode;
        frame.title = nextMode === "mobile"
          ? "The Localhost — Mobile / Tablet"
          : "The Localhost — Desktop";
        frame.srcdoc = decodeHtml(nextMode === "mobile" ? MOBILE_B64 : DESKTOP_B64);
      };

      let resizeTimer = 0;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderExperience,120);
      });

      renderExperience();
    })();
  </script>
